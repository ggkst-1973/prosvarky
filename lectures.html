<script>
    (function() {
        
        const bottomNav = document.getElementById('cdsBottomNav');
        
        function findFooter() {
            return document.querySelector('footer') || document.querySelector('.footer') || document.querySelector('[data-footer]');
        }
        
        function handleSticky() {
            if (!bottomNav) return;
            const footer = findFooter();
            const scrollY = window.scrollY;
            const documentHeight = document.documentElement.scrollHeight;
            const viewportHeight = window.innerHeight;
            const distanceToBottom = documentHeight - (scrollY + viewportHeight);
            
            if (footer) {
                const footerHeight = footer.offsetHeight;
                if (distanceToBottom <= footerHeight + 25) {
                    bottomNav.classList.remove('cds-fixed-bottom');
                } 
                else if (scrollY > 150) {
                    bottomNav.classList.add('cds-fixed-bottom');
                } else {
                    bottomNav.classList.remove('cds-fixed-bottom');
                }
            } else {
                if (scrollY > 150) {
                    bottomNav.classList.add('cds-fixed-bottom');
                } else {
                    bottomNav.classList.remove('cds-fixed-bottom');
                }
            }
        }
        
        const navLinks = document.querySelectorAll('.cds-nav-link');
        const currentPage = window.location.pathname.split('/').pop() || 'index.html';
        
        function setActiveByUrl() {
            navLinks.forEach(link => {
                const href = link.getAttribute('href');
                if (href === currentPage || 
                    (currentPage === 'index.html' && href === 'index.html') ||
                    (href && href.includes(currentPage))) {
                    link.classList.add('cds-active');
                } else {
                    link.classList.remove('cds-active');
                }
            });
        }
        
        navLinks.forEach(link => {
            link.addEventListener('click', function() {
                navLinks.forEach(l => l.classList.remove('cds-active'));
                this.classList.add('cds-active');
            });
        });
        
        setActiveByUrl();
        
     
        window.addEventListener('scroll', handleSticky);
        window.addEventListener('resize', handleSticky);
        handleSticky();
        
        
        window.cdsBottomNav = {
            refreshSticky: handleSticky,
            setActiveByUrl: setActiveByUrl
        };
    })();
</script>

                <p>Поставщиком свободных электронов в дугу является процесс эмиссии.</p>
                
                <p><strong>Эмиссия</strong> - это выделение электронов с поверхности катода.</p>

                    <span class="alpha-link" onclick="document.getElementById('letter-у').scrollIntoView({behavior:'smooth'})">У</span>
                    <span class="alpha-link" onclick="document.getElementById('letter-ф').scrollIntoView({behavior:'smooth'})">Ф</span>
                    <span class="alpha-link" onclick="document.getElementById('letter-х').scrollIntoView({behavior:'smooth'})">Х</span>
                    <span class="alpha-link" onclick="document.getElementById('letter-э').scrollIntoView({behavior:'smooth'})">Э</span>
                </div>
                
                <div class="glossary-list">
                    <div class="glossary-section" id="letter-б">
                        <div class="section-letter">Б</div>
                        <div class="term-row"><div class="term-name">Блуждание дуги</div><div class="term-desc">беспорядочное перемещение сварочной дуги по изделию.</div></div>
                    </div>
                    
                    <div class="glossary-section" id="letter-д">
                        <div class="section-letter">Д</div>
                        <div class="term-row"><div class="term-name">Длинная дуга</div><div class="term-desc">длина дуги свыше 6мм.</div></div>
                        <div class="term-row"><div class="term-name">Дуга прямого действия</div><div class="term-desc">дуговой разряд происходит между электродом и изделием.</div></div>
                        <div class="term-row"><div class="term-name">Дуга косвенного действия</div><div class="term-desc">дуговой разряд происходит между двумя электродами.</div></div>
                        <div class="term-row"><div class="term-name">Дуга комбинированного действия</div><div class="term-desc">дуговой разряд происходит между двумя электродами и изделием.</div></div>
                    </div>
                    
                    <div class="glossary-section" id="letter-и">
                        <div class="section-letter">И</div>
                        <div class="term-row"><div class="term-name">Ионизация нагревом (термоионизация)</div><div class="term-desc">протекает за счет высоких температур.</div></div>
                        <div class="term-row"><div class="term-name">Ионизация облучением (фотоионизация)</div><div class="term-desc">процесс образования заряженных частиц за счет поглощения газом световых квантов.</div></div>
                        <div class="term-row"><div class="term-name">Ионизация соударением</div><div class="term-desc">электроны движутся с большой скоростью, встречаются с нейтральными атомами газа, ударяются о них, выбивают электроны и ионизируют атомы.</div></div>
                    </div>
                    
                    <div class="glossary-section" id="letter-к">
                        <div class="section-letter">К</div>
                        <div class="term-row"><div class="term-name">Катодная зона</div><div class="term-desc">длиной около 0,00001 см начинается с раскаленного торца электрода, на котором расположено катодное пятно.</div></div>
                        <div class="term-row"><div class="term-name">Короткая дуга</div><div class="term-desc">длина дуги lд = 2-4 мм.</div></div>
                    </div>
                    
                    <div class="glossary-section" id="letter-н">
                        <div class="section-letter">Н</div>
                        <div class="term-row"><div class="term-name">Напряжение холостого хода</div><div class="term-desc">напряжение на клеммах источника питания при разомкнутой цепи.</div></div>
                        <div class="term-row"><div class="term-name">Нормальная дуга</div><div class="term-desc">длина дуги lд = 4-6 мм.</div></div>
                    </div>
                    
                    <div class="glossary-section" id="letter-о">
                        <div class="section-letter">О</div>
                        <div class="term-row"><div class="term-name">Обратная полярность</div><div class="term-desc">электрод присоединяется к положительному полюсу, объект сварки к отрицательному, Тк = 3000°С.</div></div>
                    </div>
                    
                    <div class="glossary-section" id="letter-п">
                        <div class="section-letter">П</div>
                        <div class="term-row"><div class="term-name">Прямая полярность</div><div class="term-desc">электрод присоединяется к отрицательному полюсу, объект сварки к положительному, Та = 4000°C.</div></div>
                    </div>
                    
                    <div class="glossary-section" id="letter-р">
                        <div class="section-letter">Р</div>
                        <div class="term-row"><div class="term-name">Рекомбинация</div><div class="term-desc">уравновешивает процессы исчезновения и образования заряженных частиц в дуге, степень ионизации газа остается постоянной.</div></div>
                    </div>
                    
                    <div class="glossary-section" id="letter-с">
                        <div class="section-letter">С</div>
                        <div class="term-row"><div class="term-name">Свободная дуга</div><div class="term-desc">дуга горит свободно между электродом и изделием.</div></div>
                        <div class="term-row"><div class="term-name">Сжатая дуга</div><div class="term-desc">расстояние между электродом и изделием принудительно сокращено.</div></div>
                        <div class="term-row"><div class="term-name">Собственное магнитное поле</div><div class="term-desc">поле, которое возникает при прохождении тока по элементам сварочной цепи.</div></div>
                        <div class="term-row"><div class="term-name">Статическая вольтамперная характеристика</div><div class="term-desc">графическая зависимость падения напряжения в дуге от силы тока при постоянной длине дуги.</div></div>
                        <div class="term-row"><div class="term-name">Столб дуги</div><div class="term-desc">участок дугового пространства между катодной и анодной зонами.</div></div>
                    </div>
                    
                    <div class="glossary-section" id="letter-у">
                        <div class="section-letter">У</div>
                        <div class="term-row"><div class="term-name">Управляемая дуга</div><div class="term-desc">дуга, помещенная в магнитное поле и отклоняющаяся в зависимости от направления этого поля.</div></div>
                    </div>
                    
                    <div class="glossary-section" id="letter-ф">
                        <div class="section-letter">Ф</div>
                        <div class="term-row"><div class="term-name">Ферромагнитные массы</div><div class="term-desc">скопление металла (станки, металлические конструкции, металлолом).</div></div>
                    </div>
                    
                    <div class="glossary-section" id="letter-х">
                        <div class="section-letter">Х</div>
                        <div class="term-row"><div class="term-name">Химическая неоднородность стали</div><div class="term-desc">различный химический состав свариваемой стали.</div></div>
                    </div>
                    
                    <div class="glossary-section" id="letter-э">
                        <div class="section-letter">Э</div>
                        <div class="term-row"><div class="term-name">Эмиссия соударения</div><div class="term-desc">положительные ионы под действием поля устремляются к катоду и передают ему энергию.</div></div>
                        <div class="term-row"><div class="term-name">Эмиссия термоэлектронная</div><div class="term-desc">способность раскаленной поверхности (катода) испускать электроны.</div></div>
                    </div>
                </div>
                
                <div style="text-align: center; margin-top: 2rem;">
                    <span class="scheme-item" onclick="document.getElementById('glossary-top').scrollIntoView({behavior:'smooth'})" style="cursor: pointer;">↑ К началу алфавита</span>
                </div>
            `
        }
    };

    window.switchPage = function(pageId) {
        document.getElementById('main-title').innerText = pages[pageId].title;
        document.getElementById('main-subhead').innerText = pages[pageId].subhead;
        document.getElementById('content-area').innerHTML = pages[pageId].content;
        window.scrollTo({ top: 0, behavior: 'smooth' });
        
        document.querySelectorAll('.nav-item').forEach(item => {
            item.classList.remove('active');
            if (item.dataset.page === pageId) item.classList.add('active');
        });
    };

    document.querySelectorAll('.nav-item').forEach(item => {
        item.addEventListener('click', (e) => {
            const page = e.target.dataset.page;
            if (page) switchPage(page);
        });
    });

    switchPage('main');
</script>
