<!doctype html>
<html lang="ru" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Галерея плакатов по сварке</title>
  <link rel="icon" type="image/png" href="image/0.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&amp;display=swap" rel="stylesheet">
  <style>
    * {
      font-family: 'Montserrat', sans-serif;
    }
    
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #431407 100%);
    }
    
    .poster-card {
      transition: all 0.3s ease;
    }
    .poster-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }
    .modal-backdrop {
      backdrop-filter: blur(8px);
    }
    .poster-img {
      transition: transform 0.3s ease;
      object-fit: cover;
    }
    .poster-card:hover .poster-img {
      transform: scale(1.05);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
    .modal-content {
      animation: fadeIn 0.3s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .poster-card {
      animation: slideUp 0.5s ease forwards;
      opacity: 0;
    }
    .modal-image {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transition: transform 0.2s ease;
      transform-origin: center center;
      display: block;
    }
    .modal-image-container {
      position: relative;
      overflow: hidden;
    }
    .modal-image-container.zoomed {
      cursor: grab;
      overflow: auto;
    }
    .modal-image-container.zoomed:active {
      cursor: grabbing;
    }
    .zoom-slider {
      width: 150px;
      height: 4px;
      background: #475569;
      border-radius: 2px;
      outline: none;
      -webkit-appearance: none;
    }
    .zoom-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      background: #ea580c;
      border-radius: 50%;
      cursor: pointer;
    }

    .page-container {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    
    .page-content {
      flex: 1;
    }
    
    .cds-bottom-wrapper {
      position: relative;
      width: 100%;
      background: transparent;
      z-index: 999;
    }
    
    .cds-bottom-nav {
      width: 100%;
      background: #FFFFFF;
      border-top: 1px solid #E2EEFF;
      border-bottom: 1px solid #E2EEFF;
      box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.05);
      transition: all 0.2s ease;
    }
    
    .cds-bottom-nav.cds-fixed-bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(12px);
      border-top: 1px solid #CDE3FF;
      box-shadow: 0 -6px 20px rgba(0, 0, 0, 0.1);
    }
    
    .cds-nav-container {
      max-width: 1320px;
      margin: 0 auto;
      padding: 0.6rem 2rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 2rem;
      flex-wrap: wrap;
    }
    
    .cds-nav-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      color: #1A2C3E;
      padding: 0.5rem 0.8rem;
      transition: 0.2s;
      border-bottom: 2px solid transparent;
      background: transparent;
      border-radius: 40px;
    }
    
    .cds-nav-icon {
      width: 22px;
      height: 22px;
      object-fit: contain;
      display: inline-block;
      vertical-align: middle;
    }
    
    .cds-nav-link.cds-active {
      color: #1E6AF5;
      border-bottom-color: #1E6AF5;
      font-weight: 600;
      background: rgba(30, 106, 245, 0.08);
    }
    
    .cds-nav-link:hover {
      color: #0F5BE3;
      border-bottom-color: #8ABDFF;
      background: rgba(30, 106, 245, 0.05);
    }
    
    @media (max-width: 860px) {
      .cds-nav-container {
        gap: 0.8rem;
        padding: 0.5rem 1rem;
      }
      .cds-nav-link {
        font-size: 0.8rem;
        padding: 0.4rem 0.6rem;
        gap: 5px;
      }
      .cds-nav-icon {
        width: 18px;
        height: 18px;
      }
    }
    
    @media (max-width: 560px) {
      .cds-nav-container {
        gap: 0.5rem;
        padding: 0.4rem 0.8rem;
      }
      .cds-nav-link {
        font-size: 0.7rem;
        padding: 0.3rem 0.5rem;
        gap: 4px;
      }
      .cds-nav-icon {
        width: 16px;
        height: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="page-container">
    
    <div class="page-content">
      <!-- Header -->
      <header class="sticky top-0 z-40 bg-slate-900/95 backdrop-blur-sm border-b border-orange-500/30">
        <div class="max-w-7xl mx-auto px-4 py-6">
          <div class="flex items-center gap-4">
            <div class="w-14 h-14 md:w-16 md:h-16 rounded-xl bg-white flex items-center justify-center shadow-lg p-2">
              <img src="https://i.imgur.com/uvrlE28.png" alt="Логотип" class="w-full h-full object-contain">
            </div>
            <div>
              <h1 id="gallery-title" class="text-2xl md:text-3xl font-bold text-white">Плакаты по сварке</h1>
              <p id="gallery-subtitle" class="text-orange-400 text-sm md:text-base">Технологии сварочных работ</p>
            </div>
          </div>
        </div>
      </header>

      <!-- Gallery Grid -->
      <main class="max-w-7xl mx-auto px-4 py-8">
        <div id="gallery-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8"></div>
      </main>
    </div>

    <div class="cds-bottom-wrapper" id="cdsBottomWrapper">
      <div class="cds-bottom-nav" id="cdsBottomNav">
        <div class="cds-nav-container">
          <a href="index.html" class="cds-nav-link" data-cds-nav="home">
            <img src="image/icon/home.png" width="24" height="24" alt="Главная" class="cds-nav-icon" onerror="this.style.display='none'">Главная
          </a>
          <a href="theory.html" class="cds-nav-link" data-cds-nav="theory">
            <img src="image/icon/book.png" width="24" height="24" alt="Теория" class="cds-nav-icon" onerror="this.style.display='none'">Теория
          </a>
          <a href="practice.html" class="cds-nav-link" data-cds-nav="practice">
            <img src="image/icon/mask.png" width="24" height="24" alt="Практика" class="cds-nav-icon" onerror="this.style.display='none'">Практика
          </a>
          <a href="test.html" class="cds-nav-link" data-cds-nav="control">
            <img src="image/icon/test.png" width="24" height="24" alt="Контроль знаний" class="cds-nav-icon" onerror="this.style.display='none'">Контроль знаний
          </a>
          <a href="help.html" class="cds-nav-link" data-cds-nav="compass">
            <img src="image/icon/compass.png" width="24" height="24" alt="Компас достижений" class="cds-nav-icon" onerror="this.style.display='none'">Компас достижений
          </a>
        </div>
      </div>
    </div>

  </div>

  <div id="modal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/90" onclick="closeModal()"></div>
    <div class="absolute inset-4 md:inset-8 lg:inset-12 bg-slate-800 rounded-2xl overflow-hidden flex flex-col shadow-2xl">
      <div class="flex items-center justify-between p-4 bg-slate-900 border-b border-slate-700">
        <h3 id="modal-title" class="text-lg md:text-xl font-bold text-white truncate pr-4"></h3>
        <div class="flex items-center gap-2">
          <span id="modal-counter" class="text-orange-400 text-sm font-medium px-3 py-1 bg-slate-800 rounded-full"></span>
          <button onclick="closeModal()" class="w-10 h-10 rounded-full bg-slate-700 hover:bg-slate-600 flex items-center justify-center">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
          </button>
        </div>
      </div>
      <div id="modal-image-container" class="flex-1 flex items-center justify-center bg-slate-900 relative p-4 overflow-hidden">
        <img id="modal-image" class="modal-image" alt="Плакат">
      </div>
      <div class="p-4 bg-slate-900 border-t border-slate-700">
        <div class="flex items-center justify-center gap-4 max-w-md mx-auto">
          <button onclick="zoomOut()" class="w-10 h-10 rounded-lg bg-slate-700 hover:bg-slate-600 flex items-center justify-center">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4" /></svg>
          </button>
          <input type="range" id="zoom-slider" class="zoom-slider" min="100" max="300" value="100" step="10" oninput="updateZoom(this.value)">
          <button onclick="zoomIn()" class="w-10 h-10 rounded-lg bg-slate-700 hover:bg-slate-600 flex items-center justify-center">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
          </button>
          <span id="zoom-level" class="text-orange-400 text-sm font-semibold min-w-[3.5rem] text-center">100%</span>
        </div>
      </div>
      <button onclick="prevPoster()" class="absolute left-4 top-1/2 -translate-y-1/2 w-12 h-12 rounded-full bg-slate-900/80 hover:bg-orange-600 backdrop-blur-sm flex items-center justify-center border border-slate-700">
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" /></svg>
      </button>
      <button onclick="nextPoster()" class="absolute right-4 top-1/2 -translate-y-1/2 w-12 h-12 rounded-full bg-slate-900/80 hover:bg-orange-600 backdrop-blur-sm flex items-center justify-center border border-slate-700">
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7" /></svg>
      </button>
    </div>
  </div>

  <script>
    const posters = [
      { id: 1, title: 'Электродуговая сварка трубопроводов', category: 'Трубопроводы', url: 'https://i.imgur.com/cpoLI9C.jpg' },
      { id: 2, title: 'Электродуговая сварка трубопроводов', category: 'Трубопроводы', url: 'https://i.imgur.com/fAASHAZ.jpg' },
      { id: 3, title: 'Вертикальные швы', category: 'Швы', url: 'https://i.imgur.com/cXxor4r.jpg' },
      { id: 4, title: 'Виды пламени', category: 'Газовая сварка', url: 'https://i.imgur.com/C99KPKe.jpg' },
      { id: 5, title: 'Выполнение вертикальных швов', category: 'Техника', url: 'https://i.imgur.com/JsvHisZ.jpg' },
      { id: 6, title: 'Выполнение горизонтальных швов', category: 'Техника', url: 'https://i.imgur.com/eNrBqQa.jpg' },
      { id: 7, title: 'Выполнение потолочных швов', category: 'Техника', url: 'https://i.imgur.com/Kudkfof.jpg' },
      { id: 8, title: 'Выполнение сварных соединений в нижнем положении', category: 'Техника', url: 'https://i.imgur.com/Tkeo0vZ.jpg' },
      { id: 9, title: 'Движение электрода при выполнении прохода', category: 'Техника', url: 'https://i.imgur.com/Ez7AtLE.jpg' },
      { id: 10, title: 'Дефекты сварных швов', category: 'Контроль', url: 'https://i.imgur.com/sz5eaTs.jpg' },
      { id: 11, title: 'Классификация и обозначение сварных швов по их положению в пространстве', category: 'Классификация', url: 'https://i.imgur.com/yTc782V.jpg' },
      { id: 12, title: 'Классификация сварных швов', category: 'Классификация', url: 'https://i.imgur.com/r1TAYRc.jpg' },
      { id: 13, title: 'Конструктивные элементы подготовки кромок и швов стыковых соединений', category: 'Подготовка', url: 'https://i.imgur.com/MSHYG0z.jpg' },
      { id: 14, title: 'Конструктивные элементы разделки', category: 'Подготовка', url: 'https://i.imgur.com/kZx1YEZ.jpg' },
      { id: 15, title: 'Манипулировние электродом', category: 'Техника', url: 'https://i.imgur.com/ywBIfux.jpg' },
      { id: 16, title: 'Напряжения и деформации сварных конструкций', category: 'Теория', url: 'https://i.imgur.com/UYlLxTi.jpg' },
      { id: 17, title: 'Основные геометрические параметры сварного шва', category: 'Параметры', url: 'https://i.imgur.com/1C8vezG.jpg' },
      { id: 18, title: 'Основные типы сварных соединений', category: 'Типы соединений', url: 'https://i.imgur.com/ShG1f5b.jpg' },
      { id: 19, title: 'Основные типы, конструктивные элементы и размеры сварных соединений', category: 'Типы соединений', url: 'https://i.imgur.com/prcKken.jpg' },
      { id: 20, title: 'Параметры режима ручной дуговой сварки', category: 'Параметры', url: 'https://i.imgur.com/P5sv3z3.jpg' }
    ];

    let currentPosterIndex = 0;
    let currentZoom = 100;

    function updateZoom(value) {
      currentZoom = parseInt(value);
      const image = document.getElementById('modal-image');
      const slider = document.getElementById('zoom-slider');
      const zoomLevel = document.getElementById('zoom-level');
      const container = document.getElementById('modal-image-container');
      image.style.transform = `scale(${currentZoom / 100})`;
      slider.value = currentZoom;
      zoomLevel.textContent = `${currentZoom}%`;
      if (currentZoom > 100) container.classList.add('zoomed');
      else container.classList.remove('zoomed');
    }

    function zoomIn() { updateZoom(Math.min(currentZoom + 20, 300)); }
    function zoomOut() { updateZoom(Math.max(currentZoom - 20, 100)); }

    function renderGallery() {
      const grid = document.getElementById('gallery-grid');
      grid.innerHTML = posters.map((poster, index) => `
        <div class="poster-card bg-slate-800/50 rounded-2xl overflow-hidden cursor-pointer border border-slate-700/50 hover:border-orange-500/50" onclick="openModal(${index})">
          <div class="aspect-[3/4] overflow-hidden bg-slate-900">
            <img src="${poster.url}" alt="${poster.title}" class="poster-img w-full h-full" loading="lazy">
          </div>
          <div class="p-5">
            <h3 class="text-white font-semibold text-base mb-3 line-clamp-2">${poster.title}</h3>
            <div class="flex items-center justify-between">
              <span class="text-xs px-3 py-1.5 bg-orange-600/20 text-orange-400 rounded-full">${poster.category}</span>
              <span class="text-slate-400 text-sm">№${poster.id}</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    function openModal(index) {
      currentPosterIndex = index;
      updateModal();
      document.getElementById('modal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
      document.body.style.overflow = '';
    }

    function updateModal() {
      const poster = posters[currentPosterIndex];
      document.getElementById('modal-title').textContent = poster.title;
      document.getElementById('modal-counter').textContent = `${currentPosterIndex + 1} / ${posters.length}`;
      updateZoom(100);
      document.getElementById('modal-image').src = poster.url;
    }

    function prevPoster() { currentPosterIndex = (currentPosterIndex - 1 + posters.length) % posters.length; updateModal(); }
    function nextPoster() { currentPosterIndex = (currentPosterIndex + 1) % posters.length; updateModal(); }

    document.addEventListener('keydown', (e) => {
      if (document.getElementById('modal').classList.contains('hidden')) return;
      if (e.key === 'ArrowLeft') prevPoster();
      if (e.key === 'ArrowRight') nextPoster();
      if (e.key === 'Escape') closeModal();
    });

    const bottomNav = document.getElementById('cdsBottomNav');
    const bottomWrapper = document.getElementById('cdsBottomWrapper');
    
    function handleSticky() {
      if (!bottomNav) return;
      
      const scrollY = window.scrollY;
      const windowHeight = window.innerHeight;
      const documentHeight = document.documentElement.scrollHeight;
      const bottomNavHeight = bottomNav.offsetHeight;
      
      if (scrollY > 100) {
        bottomNav.classList.add('cds-fixed-bottom');
        // Добавляем отступ снизу для body, чтобы контент не перекрывался
        document.body.style.paddingBottom = bottomNavHeight + 'px';
      } else {
        bottomNav.classList.remove('cds-fixed-bottom');
        document.body.style.paddingBottom = '0px';
      }
    }
    
    const navLinks = document.querySelectorAll('.cds-nav-link');
    const currentPage = window.location.pathname.split('/').pop() || 'index.html';
    
    navLinks.forEach(link => {
      const href = link.getAttribute('href');
      if (href === currentPage) {
        link.classList.add('cds-active');
      }
      link.addEventListener('click', function() {
        navLinks.forEach(l => l.classList.remove('cds-active'));
        this.classList.add('cds-active');
      });
    });
    
    window.addEventListener('scroll', handleSticky);
    window.addEventListener('resize', handleSticky);
    handleSticky();

    renderGallery();
  </script>
</body>
</html>
